<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#2ea043" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2ea043" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 深色圆角底 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#0d1117"/>
  <rect x="5" y="5" width="118" height="118" rx="27" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <!-- 绿色辉光 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#glow)"/>

  <!-- 代码括号 </> -->
  <path d="M33 42 L19 64 L33 86" fill="none" stroke="#8b949e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M95 42 L109 64 L95 86" fill="none" stroke="#8b949e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 贡献热力图阶梯（4×4 格子，绿色等级由浅到亮，向右下上升） -->
  <!-- 第 1 行（顶） -->
  <rect x="43"  y="44" width="9" height="9" rx="2.2" fill="#21262d"/>
  <rect x="55"  y="44" width="9" height="9" rx="2.2" fill="#21262d"/>
  <rect x="67"  y="44" width="9" height="9" rx="2.2" fill="#0e4429"/>
  <rect x="79"  y="44" width="9" height="9" rx="2.2" fill="#006d32"/>
  <!-- 第 2 行 -->
  <rect x="43"  y="56" width="9" height="9" rx="2.2" fill="#21262d"/>
  <rect x="55"  y="56" width="9" height="9" rx="2.2" fill="#0e4429"/>
  <rect x="67"  y="56" width="9" height="9" rx="2.2" fill="#006d32"/>
  <rect x="79"  y="56" width="9" height="9" rx="2.2" fill="#26a641"/>
  <!-- 第 3 行 -->
  <rect x="43"  y="68" width="9" height="9" rx="2.2" fill="#0e4429"/>
  <rect x="55"  y="68" width="9" height="9" rx="2.2" fill="#006d32"/>
  <rect x="67"  y="68" width="9" height="9" rx="2.2" fill="#26a641"/>
  <rect x="79"  y="68" width="9" height="9" rx="2.2" fill="#39d353"/>
  <!-- 第 4 行（底，最亮） -->
  <rect x="43"  y="80" width="9" height="9" rx="2.2" fill="#006d32"/>
  <rect x="55"  y="80" width="9" height="9" rx="2.2" fill="#26a641"/>
  <rect x="67"  y="80" width="9" height="9" rx="2.2" fill="#39d353"/>
  <rect x="79"  y="80" width="9" height="9" rx="2.2" fill="#39d353"/>

  <!-- 最亮点（今日）白框高亮 -->
  <rect x="78.4" y="79.4" width="10.2" height="10.2" rx="2.6" fill="none" stroke="#ffffff" stroke-width="1.4"/>
</svg>
